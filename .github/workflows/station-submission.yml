name: Station submission → PR

# Turns a "📻 Add my station" issue (see .github/ISSUE_TEMPLATE/add-station.yml)
# into a one-file pull request against main — so community members can list
# their station WITHOUT forking the repo or hand-writing JSON. A maintainer then
# reviews and merges the generated PR; it lands in the directory on merge.
#
# Security: the issue body is UNTRUSTED user input. It is parsed and written to
# a file entirely inside actions/github-script via the REST API (Buffer/base64,
# createOrUpdateFileContents) — it is NEVER interpolated into a shell `run:`
# step, so there is no command-injection surface. The only file this workflow
# can write is stations/<slug>.json (slug is sanitised to [a-z0-9-]). PRs
# opened by GITHUB_TOKEN don't re-trigger pull_request workflows, which is fine
# here — the content is generated, and lint runs on the push to main after merge.

# NOTE: the `station-submission` label MUST exist as a repo label, otherwise
# GitHub silently drops it from the issue template and the `if:` guard below
# never matches (every run shows "skipped"). `labeled` is included so a
# maintainer can re-trigger a stuck submission by re-applying the label.
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # Serialise per-issue so rapid edits don't race on the same branch.
  group: station-submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build-pr:
    name: Build station PR from issue
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.build.outputs.branch }}
      built: ${{ steps.build.outputs.built }}
    # Only act on issues opened through the station-submission form.
    if: contains(join(github.event.issue.labels.*.name, ','), 'station-submission')
    steps:
      - uses: actions/github-script@v7
        id: build
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const BASE = 'main';
            const DIR = 'stations';

            // --- 1. Parse the issue-form body into a { heading: value } map ---
            // GitHub renders each form field as "### <label>\n\n<value>", with
            // multi-line values (textareas) spanning several lines. Empty
            // optional fields render as "_No response_". Walk line-by-line so a
            // multi-line description isn't truncated.
            const body = issue.body || '';
            const fields = {};
            let curKey = null, buf = [];
            const flush = () => {
              if (curKey === null) return;
              let v = buf.join('\n').trim();
              if (v === '_No response_') v = '';
              fields[curKey] = v;
            };
            for (const line of body.split(/\r?\n/)) {
              const h = line.match(/^###\s+(.+?)\s*$/);
              if (h) { flush(); curKey = h[1].trim(); buf = []; }
              else if (curKey !== null) { buf.push(line); }
            }
            flush();
            const get = (label) => (fields[label] || '').trim();

            const name = get('Station name');
            const url = get('Public URL').replace(/\/+$/, '');
            const location = get('Location (City, Country)');
            const country = get('Country');
            const operator = get('Operator');
            const latRaw = get('Latitude');
            const lonRaw = get('Longitude');
            const genre = get('Genre / vibe');
            const description = get('Description');

            // --- 2. Validate the floor (name + url) ---
            const problems = [];
            if (!name) problems.push('**Station name** is required.');
            if (!url) problems.push('**Public URL** is required.');
            else if (!/^https?:\/\/.+/i.test(url))
              problems.push('**Public URL** must start with `http://` or `https://`.');

            const fail = async (lines) => {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `⚠️ I couldn't build a pull request from this submission:\n\n` +
                  lines.map((l) => `- ${l}`).join('\n') +
                  `\n\nEdit the issue to fix it and I'll try again automatically.`,
              });
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number, labels: ['needs-info'],
              }).catch(() => {});
            };

            if (problems.length) { core.setOutput('built', 'false'); await fail(problems); return; }

            // --- 3. Build the slug + station JSON ---
            const slug = name.toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 60) || `station-${issue.number}`;

            const station = { name, url };
            if (operator) station.operator = operator;
            if (location) station.location = location;
            if (country) station.country = country;
            const lat = Number(latRaw), lon = Number(lonRaw);
            if (latRaw && lonRaw && Number.isFinite(lat) && Number.isFinite(lon)) {
              station.lat = lat; station.lon = lon;
            }
            if (genre) station.genre = genre;
            if (description) station.description = description;
            station.featured = false;
            station.submitted = new Date(issue.created_at).toISOString().slice(0, 10);

            const filePath = `${DIR}/${slug}.json`;
            const content = JSON.stringify(station, null, 2) + '\n';
            const contentB64 = Buffer.from(content, 'utf8').toString('base64');

            // --- 4. Ensure a branch off main ---
            const branch = `station/${slug}`;
            const baseRef = await github.rest.git.getRef({
              owner, repo, ref: `heads/${BASE}`,
            });
            const baseSha = baseRef.data.object.sha;
            try {
              await github.rest.git.createRef({
                owner, repo, ref: `refs/heads/${branch}`, sha: baseSha,
              });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 = branch already exists (edited issue)
            }

            // --- 5. Write/refresh the station file on that branch ---
            // Previous content of the file on the branch, so step 8 can tell a real
            // edit from a re-run that rewrites the identical entry.
            let prevContent = '';
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner, repo, path: filePath, ref: branch,
              });
              existingSha = existing.data.sha;
              prevContent = Buffer.from(existing.data.content || '', 'base64').toString('utf8');
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: filePath, branch,
              message: `feat(stations): add ${name} (from #${issue.number})`,
              content: contentB64,
              ...(existingSha ? { sha: existingSha } : {}),
            });

            // --- 6. Open the PR (or reuse the existing one) ---
            const open = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`,
            });
            let pr = open.data[0];
            let openedPr = false;
            const prBody =
              `Adds **${name}** to the [stations directory](${url}).\n\n` +
              `Generated automatically from #${issue.number}. Closes #${issue.number}.\n\n` +
              '```json\n' + content + '```\n';
            if (!pr) {
              const created = await github.rest.pulls.create({
                owner, repo, base: BASE, head: branch,
                title: `feat(stations): add ${name}`,
                body: prBody,
              });
              pr = created.data;
              openedPr = true;
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: ['stations'],
              }).catch(() => {});
            } else {
              await github.rest.pulls.update({
                owner, repo, pull_number: pr.number, body: prBody,
              });
            }

            // The branch name is derived from the slug, so renaming the slug on the
            // issue sends the next run to a different branch: the lookup above finds
            // no PR, opens a second one, and the first stays open still claiming
            // "Closes #<issue>". Close any other open PR built from this issue so a
            // rename leaves exactly one, and the stale copy can't be merged alongside
            // the current one under a different slug.
            const madeBy = `Generated automatically from #${issue.number}.`;
            const allOpen = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            for (const stale of allOpen) {
              if (stale.number === pr.number) continue;
              if (!(stale.body || '').includes(madeBy)) continue;
              await github.rest.issues.createComment({
                owner, repo, issue_number: stale.number,
                body: `Superseded by #${pr.number} — #${issue.number} now builds \`${filePath}\`, ` +
                  `so this branch carries an out-of-date copy under the old slug. Closing it ` +
                  `so the submission has a single open PR.`,
              });
              await github.rest.pulls.update({
                owner, repo, pull_number: stale.number, state: 'closed',
              });
            }

            // Hand the branch to the validate job below.
            core.setOutput('branch', branch);
            core.setOutput('built', 'true');

            // --- 7. Tell the contributor ---
            await github.rest.issues.removeLabel({
              owner, repo, issue_number: issue.number, name: 'needs-info',
            }).catch(() => {});

            // Only re-notify when the entry itself changed. The issue template applies
            // its label at creation, so `opened` and `labeled` both fire and the second
            // run rewrites an identical file; same for an edit that only touches the
            // reviewer note. A duplicate "✅ Opened" comment is pure noise.
            const settled = (t) => t.replace(/^dateModified:.*$/m, '').trim();
            if (!openedPr && settled(prevContent) === settled(content)) return;

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `✅ Opened ${pr.html_url} with your station at \`${filePath}\`.\n\n` +
                `A maintainer will review and merge it — your station appears on the ` +
                `map on the next deploy. Need to change something? Just edit this issue ` +
                `and the PR updates automatically.`,
            });

  # A PR opened with GITHUB_TOKEN does not trigger further workflow runs, so
  # validate-catalog.yml never fires on these branches — every generated PR
  # reached review with no checks at all. Run the same check here, inside the
  # run that is already authorised, and report a failure back on the issue.
  validate:
    name: Validate generated entry
    needs: build-pr
    if: needs.build-pr.outputs.built == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-pr.outputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate catalog entries
        shell: bash
        run: |
          set -o pipefail
          node scripts/build-catalog.mjs --check 2>&1 | tee /tmp/catalog-check.log
      - name: Report failure on the issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/catalog-check.log', 'utf8').slice(-3000); } catch {}
            const fence = '```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '⚠️ The catalog check failed on the branch built from this submission:\n\n' +
                fence + '\n' + log + '\n' + fence + '\n\n' +
                'A maintainer will take a look — you may not need to do anything.',
            });
